# Existing design/convention evidence. Data only; grants no execution authority.
domainContracts=Immutable Java records with String keys and int filterOrder
persistence=In-memory CUSTOMER_FILTER repository adapter; no database and no SQL execution
mapping=Constructor-injected CustomerFilterMapper converts immutable rows to response records
service=Constructor-injected Spring Service delegates insertion to the repository
api=POST /customer-filters with AddCustomerFilterRequest returns CustomerFilterResponse; invalid=400 missing=404
testing=JUnit Jupiter tests assert hierarchy order, sibling shifts, isolation and unchanged state on rejection
request.path=src/main/java/demo/customer/AddCustomerFilterRequest.java
tests.path=src/test/java/demo/customer/AddCustomerFilterTest.java
request.directory=src/main/java/demo/customer
tests.directory=src/test/java/demo/customer
operation=addCustomerFilter
table=CUSTOMER_FILTER
type=INSERT
strategy=SHIFT
behavior=Insert after the referenced sibling and increment each following sibling order in the same parent by one
consistency=Validate and copy under the repository monitor, then publish once; synchronized readers see one complete state
testOutcome=New Filter follows Customer Title; Credit Score and Age shift; other parents remain unchanged; rejected requests do not mutate
validationExpectation=Compile the Spring components and execute JUnit insertion, invalid-input, missing-reference, duplicate-key and API-contract tests
